<section id="loginScreen" class="login-screen hidden">
  <div class="login-visual">
    <span class="dmb-logo dmb-logo--white dmb-logo--large" role="img" aria-label="DMB Bombas"></span>
    <div><span>PORTAL CORPORATIVO</span><h1>Informação organizada.<br>Decisões mais rápidas.</h1><p>Despesas, visitas e gestão comercial em um único ambiente seguro.</p></div>
  </div>
  <div class="login-panel">
    <form id="loginForm" class="login-card">
      <span class="mobile-brand dmb-logo dmb-logo--blue dmb-logo--mobile" role="img" aria-label="DMB Bombas"></span>
      <span class="eyebrow">BEM-VINDO</span><h2>Acesse sua conta</h2><p>Use o login ou e-mail cadastrado pela administração.</p>
      <label>Login ou e-mail<input id="loginEmail" type="text" autocomplete="username" placeholder="Digite seu login ou e-mail" required></label>
      <label>Senha<div class="password-wrap"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Digite sua senha" required><button id="togglePassword" type="button" aria-label="Mostrar senha">◉</button></div></label>
      <p id="loginError" class="form-error hidden"></p>
      <button type="submit" class="primary full">Entrar no portal <span>→</span></button>
      <small class="login-help">Problemas de acesso? Procure o administrador do sistema.</small>
    </form>
  </div>
</section>
