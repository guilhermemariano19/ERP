name: Build DMB TV Box V17 APK

on:
  push:
    branches:
      - build-dmb-tvbox-v17-apk
    paths:
      - 'android-tvbox-v17/**'
      - '.github/workflows/build-dmb-tvbox-v17.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android-tvbox-v17 :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-tvbox-v17/app/build/outputs/apk/debug/app-debug.apk DMB_Compras_Almox_TVBox_V17.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DMB_Compras_Almox_TVBox_V17
          path: DMB_Compras_Almox_TVBox_V17.apk
          if-no-files-found: error
          retention-days: 7
