<script>
(function(){
  let users=[];
  let initialized=false;
  let userDraft=null;
  const $=function(selector){return document.querySelector(selector);};

  function cell(text,className){const td=document.createElement('td');if(className)td.className=className;td.textContent=text;return td;}
  function actionButton(label,action,id){const button=document.createElement('button');button.type='button';button.className='table-action';button.dataset.action=action;button.dataset.id=id;button.textContent=label;return button;}

  function render(){
    const body=$('#usersTableBody');body.textContent='';$('#userCount').textContent=users.length+' '+(users.length===1?'usuário':'usuários');
    if(!users.length){const row=document.createElement('tr');const empty=cell('Nenhum usuário cadastrado.','empty');empty.colSpan=5;row.appendChild(empty);body.appendChild(row);return;}
    users.forEach(function(user){
      const row=document.createElement('tr');
      const name=document.createElement('td');const strong=document.createElement('strong');strong.textContent=user.name;name.appendChild(strong);if(user.isMaster){const small=document.createElement('small');small.textContent='Administrador master';name.appendChild(small);}row.appendChild(name);
      row.appendChild(cell(user.login||user.email||''));
      const admin=document.createElement('td');const adminBadge=document.createElement('span');adminBadge.className='access-badge '+(user.isAdmin?'yes':'no');adminBadge.textContent=user.isAdmin?'Sim':'Não';admin.appendChild(adminBadge);row.appendChild(admin);
      const active=document.createElement('td');const activeBadge=document.createElement('span');activeBadge.className='status '+(user.active?'aprovado':'rejeitado');activeBadge.textContent=user.active?'Ativo':'Bloqueado';active.appendChild(activeBadge);row.appendChild(active);
      const actions=document.createElement('td');actions.className='row-actions';actions.appendChild(actionButton('Editar','edit',user.id));actions.appendChild(actionButton('Redefinir senha','reset-password',user.id));row.appendChild(actions);body.appendChild(row);
    });
  }

  function setDraftState(mode,message){
    const state=$('#userDraftState');state.classList.remove('idle','dirty','ready');state.classList.add(mode);state.querySelector('small').textContent=message;
  }

  function collectDraft(){
    return {
      id:$('#userId').value,
      name:$('#userFullName').value.trim(),
      login:$('#userLogin').value.trim(),
      sellerId:$('#userSellerId').value.trim(),
      isAdmin:$('#userIsAdmin').value==='true',
      active:$('#userActive').value==='true'
    };
  }

  function captureDraft(){
    userDraft=collectDraft();
    setDraftState('dirty','Alterações mantidas somente nesta tela; o banco ainda não foi alterado.');
    $('#userFormNotice').classList.add('hidden');
  }

  function closeReview(){
    $('#userReviewModal').classList.add('hidden');
    $('#userReviewError').classList.add('hidden');
  }

  function clearForm(){
    $('#userForm').reset();$('#userId').value='';$('#userFormTitle').textContent='Novo usuário';$('#userTemporaryPassword').required=true;$('#userIsAdmin').disabled=false;$('#userActive').disabled=false;$('#userLogin').readOnly=false;$('#userFormNotice').classList.add('hidden');userDraft=null;closeReview();setDraftState('idle','Nenhum dado foi enviado ao banco.');
  }

  function editUser(id){
    const user=users.find(function(item){return String(item.id)===String(id);});if(!user)return;
    $('#userId').value=user.id;$('#userFullName').value=user.name||'';$('#userLogin').value=user.login||user.email||'';$('#userSellerId').value=user.sellerId||'';$('#userIsAdmin').value=user.isAdmin?'true':'false';$('#userActive').value=user.active?'true':'false';$('#userTemporaryPassword').value='';$('#userTemporaryPassword').required=false;$('#userFormTitle').textContent='Editar usuário';
    $('#userIsAdmin').disabled=!!user.isMaster;$('#userActive').disabled=!!user.isMaster;$('#userLogin').readOnly=!!user.isMaster;$('#userFormNotice').classList.add('hidden');captureDraft();$('#userFullName').focus();
  }

  async function load(){
    if(!window.DMBApp||!DMBApp.state.token)return;
    DMBApp.busy(true);try{users=await DMBApi.call('apiListarUsuarios',DMBApp.state.token);render();}catch(error){DMBApp.toast(error.message,'error');}finally{DMBApp.busy(false);}
  }

  function validateDraft(draft,password){
    if(!draft.name)return 'Informe o nome completo.';
    if(!draft.login)return 'Informe o login ou e-mail.';
    if(!draft.id&&password.length<6)return 'Informe uma senha inicial com pelo menos 6 caracteres.';
    if(password&&password.length<6)return 'A nova senha deve ter pelo menos 6 caracteres.';
    return '';
  }

  function reviewDraft(event){
    event.preventDefault();
    const password=$('#userTemporaryPassword').value;userDraft=collectDraft();const error=validateDraft(userDraft,password);
    if(error){$('#userFormNotice').textContent=error;$('#userFormNotice').classList.remove('hidden');return;}
    $('#userFormNotice').classList.add('hidden');$('#userReviewTitle').textContent=userDraft.id?'Confirmar alteração do usuário':'Confirmar novo usuário';$('#reviewUserName').textContent=userDraft.name;$('#reviewUserLogin').textContent=userDraft.login;$('#reviewUserAdmin').textContent=userDraft.isAdmin?'Sim':'Não';$('#reviewUserActive').textContent=userDraft.active?'Ativo':'Bloqueado';$('#reviewUserSeller').textContent=userDraft.sellerId||'Não vinculado';$('#reviewUserPassword').textContent=password?'Definida — conteúdo protegido':'Manter senha atual';
    setDraftState('ready','Rascunho revisado; aguardando sua confirmação para gravar.');$('#userReviewModal').classList.remove('hidden');$('#confirmUserSave').focus();
  }

  async function confirmSave(){
    if(!userDraft)return;
    const password=$('#userTemporaryPassword').value;const error=validateDraft(userDraft,password);if(error){$('#userReviewError').textContent=error;$('#userReviewError').classList.remove('hidden');return;}
    const payload=Object.assign({},userDraft,{temporaryPassword:password});const button=$('#confirmUserSave');button.disabled=true;DMBApp.busy(true);
    try{await DMBApi.call('apiSalvarUsuario',DMBApp.state.token,payload);DMBApp.toast(userDraft.id?'Usuário atualizado com sucesso.':'Usuário cadastrado com sucesso.','success');clearForm();await load();}
    catch(saveError){$('#userReviewError').textContent=saveError.message;$('#userReviewError').classList.remove('hidden');}
    finally{button.disabled=false;DMBApp.busy(false);}
  }

  async function resetPassword(id){
    const user=users.find(function(item){return String(item.id)===String(id);});if(!user)return;
    const password=window.prompt('Digite a nova senha temporária para '+user.name+' (mínimo de 6 caracteres):');if(password===null)return;if(password.length<6)return DMBApp.toast('A senha deve ter pelo menos 6 caracteres.','error');
    DMBApp.busy(true);try{await DMBApi.call('apiRedefinirSenhaUsuario',DMBApp.state.token,id,password);DMBApp.toast('Senha redefinida. O usuário deverá alterá-la no próximo acesso.','success');await load();}catch(error){DMBApp.toast(error.message,'error');}finally{DMBApp.busy(false);}
  }

  function init(){
    if(initialized)return;initialized=true;$('#userForm').addEventListener('submit',reviewDraft);$('#userForm').addEventListener('input',captureDraft);$('#userForm').addEventListener('change',captureDraft);$('#clearUserForm').addEventListener('click',clearForm);$('#cancelUserReview').addEventListener('click',closeReview);$('#confirmUserSave').addEventListener('click',confirmSave);$('#usersTableBody').addEventListener('click',function(event){const button=event.target.closest('[data-action]');if(!button)return;if(button.dataset.action==='edit')editUser(button.dataset.id);if(button.dataset.action==='reset-password')resetPassword(button.dataset.id);});clearForm();
  }

  window.DMBAdmin={init:init,load:function(){init();return load();}};
})();

</script>
