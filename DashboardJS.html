<script>
(function(){
  let items=[];let initialized=false;
  function initialize(){if(initialized)return;initialized=true;document.querySelector('#applyFilters').addEventListener('click',load);document.querySelector('#clearFilters').addEventListener('click',clear);document.querySelector('#exportCsv').addEventListener('click',exportCsv);const bounds=DMBUtils.monthBounds();document.querySelector('#filterStart').value=bounds.start;document.querySelector('#filterEnd').value=bounds.end;}
  async function load(){initialize();DMBApp.busy(true);try{const filters={sellerId:document.querySelector('#filterSeller').value,route:document.querySelector('#filterRoute').value,startDate:document.querySelector('#filterStart').value,endDate:document.querySelector('#filterEnd').value};items=await DMBApi.call('apiListarDespesas',DMBApp.state.token,filters);populateFilters(items);render(items);}catch(error){DMBApp.toast(error.message,'error');}finally{DMBApp.busy(false);}}
  function populateFilters(data){const seller=document.querySelector('#filterSeller'),route=document.querySelector('#filterRoute'),sellerValue=seller.value,routeValue=route.value;const sellers={},routes={};data.forEach(function(item){sellers[item.sellerId]=item.sellerName;routes[item.route]=item.route;});seller.innerHTML='<option value="">Todos</option>'+Object.keys(sellers).map(function(id){return '<option value="'+DMBUtils.escapeHtml(id)+'">'+DMBUtils.escapeHtml(sellers[id])+'</option>';}).join('');route.innerHTML='<option value="">Todas</option>'+Object.keys(routes).sort().map(function(value){return '<option>'+DMBUtils.escapeHtml(value)+'</option>';}).join('');seller.value=sellerValue;route.value=routeValue;}
  function render(data){
    const total=data.reduce(function(sum,item){return sum+item.amount;},0),approved=data.filter(function(x){return x.status==='APROVADO'||x.status==='PAGO';}).reduce(function(sum,item){return sum+item.amount;},0),pending=data.filter(function(x){return x.status!=='APROVADO'&&x.status!=='PAGO';}).length,routeTotals={};data.forEach(function(item){routeTotals[item.route]=(routeTotals[item.route]||0)+item.amount;});const biggest=Object.keys(routeTotals).sort(function(a,b){return routeTotals[b]-routeTotals[a];})[0]||'—';
    document.querySelector('#metricTotal').textContent=DMBUtils.money(total);document.querySelector('#metricCount').textContent=data.length+' lançamento'+(data.length===1?'':'s');document.querySelector('#metricApproved').textContent=DMBUtils.money(approved);document.querySelector('#metricPending').textContent=pending;document.querySelector('#metricRoute').textContent=biggest;document.querySelector('#metricRouteValue').textContent=DMBUtils.money(routeTotals[biggest]||0);document.querySelector('#tableCount').textContent=data.length+' registro'+(data.length===1?'':'s');
    document.querySelector('#expenseTableBody').innerHTML=data.map(function(item){const statusLabel=String(item.status||'').replace(/_/g,' ').toLowerCase().replace(/(^|\s)\S/g,function(letter){return letter.toUpperCase();});return '<tr><td><strong>'+formatDate(item.date)+'</strong><small>'+DMBUtils.escapeHtml(item.id)+'</small></td><td>'+DMBUtils.escapeHtml(item.sellerName)+'</td><td><strong>'+DMBUtils.escapeHtml(item.route)+'</strong><small>'+DMBUtils.escapeHtml(item.clientName)+'</small></td><td><span class="category">'+DMBUtils.escapeHtml(item.category)+'</span></td><td class="amount">'+DMBUtils.money(item.amount)+'</td><td>'+(item.receiptUrl?'<a href="'+DMBUtils.escapeHtml(item.receiptUrl)+'" target="_blank" rel="noopener">↗ Abrir foto</a>':'—')+'</td><td><span class="status '+String(item.status||'').toLowerCase()+'">'+DMBUtils.escapeHtml(statusLabel)+'</span></td></tr>';}).join('');document.querySelector('#tableEmpty').classList.toggle('hidden',data.length>0);document.querySelector('.table-wrap').classList.toggle('hidden',data.length===0);
  }
  function formatDate(value){const p=String(value||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:value;}
  function clear(){const bounds=DMBUtils.monthBounds();document.querySelector('#filterSeller').value='';document.querySelector('#filterRoute').value='';document.querySelector('#filterStart').value=bounds.start;document.querySelector('#filterEnd').value=bounds.end;load();}
  function exportCsv(){if(!items.length)return DMBApp.toast('Não há dados para exportar.','error');const rows=[['Data','ID','Vendedor','Rota','Cliente','Categoria','Valor','Forma de pagamento','Status','Comprovante']].concat(items.map(function(x){return [x.date,x.id,x.sellerName,x.route,x.clientName,x.category,x.amount,x.paymentMethod,x.status,x.receiptUrl];}));DMBUtils.downloadCsv('despesas-dmb.csv',rows);}
  window.DMBDashboard={load:load};
})();

</script>
