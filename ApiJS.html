<script>
(function(){
  function call(functionName){
    const args=Array.prototype.slice.call(arguments,1);
    return new Promise(function(resolve,reject){
      const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(function(error){reject(new Error(error&&error.message?error.message:String(error||'Erro inesperado.')));});
      runner[functionName].apply(runner,args);
    });
  }
  window.DMBApi={call:call};
})();

</script>
